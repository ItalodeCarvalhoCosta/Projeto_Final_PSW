<h1>{{ categoria.nome }}</h1><p>{{ categoria.descricao }}</p>
<a href="{% url 'produto:editar_categoria' categoria.id %}">Editar</a> <a href="{% url 'produto:excluir_categoria' categoria.id %}">Excluir</a>
<h2>Produtos</h2><ul>{% for produto in categoria.produtos.all %}<li><a href="{% url 'produto:detalhe_produto' produto.id %}">{{ produto.nome }}</a></li>{% empty %}<li>Nenhum produto nesta categoria.</li>{% endfor %}</ul>
