<h1>{% if produto %}Editar{% else %}Criar{% endif %} produto</h1><form method="post">{% csrf_token %}<label>Categoria: <select name="categoria">{% for categoria in categorias %}<option value="{{ categoria.id }}" {% if produto.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nome }}</option>{% endfor %}</select></label><br><label>Nome: <input name="nome" value="{{ produto.nome }}"></label><br><label>Descrição: <textarea name="descricao">{{ produto.descricao }}</textarea></label><br><label>Preço: <input type="number" step="0.01" name="preco" value="{{ produto.preco }}"></label><br><label>Estoque: <input type="number" name="estoque" value="{{ produto.estoque }}"></label><br><label>Peso: <input type="number" step="0.01" name="peso" value="{{ produto.peso }}"></label><br><input type="submit" value="Salvar"></form>
