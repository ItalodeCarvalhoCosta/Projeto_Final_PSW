<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h2>Entrar</h2>

<form method="POST">

    {% csrf_token %}

    <input 
        type="text" 
        name="username"
        placeholder="Usuário">

    <br>

    <input 
        type="password" 
        name="password"
        placeholder="Senha">

    <br>

    <button type="submit">
        Entrar
    </button>

</form>


{% if erro %}
<p>{{ erro }}</p>
{% endif %}


</body>
</html>
